# Publicação do site. O plugin do Next.js é instalado pela própria Netlify
# quando ela detecta o framework; não precisa estar no package.json.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# O editor do blog. Sem isto, /admin devolve 404 em vez de abrir o editor.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Landing pages de tráfego pago (HTML estático em public/).
[[redirects]]
  from = "/lp-divorcio-01"
  to = "/lp-divorcio-01/index.html"
  status = 200

[[redirects]]
  from = "/familia"
  to = "/familia/index.html"
  status = 200

[[redirects]]
  from = "/familia-02"
  to = "/familia-02/index.html"
  status = 200

[[redirects]]
  from = "/lp-exoneracao-01"
  to = "/lp-exoneracao-01/index.html"
  status = 200
